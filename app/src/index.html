<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D5C7E">
<meta name="description" content="SAIMAP Psicología: aprende Psicología con lecciones cortas, repaso diario y rutas para el Grado y el PIR.">
<title>SAIMAP Psicología</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
@font-face{font-family:"Bricolage Grotesque";src:url(fonts/bricolage-600.woff) format("woff");font-weight:600;font-display:swap}
@font-face{font-family:"Bricolage Grotesque";src:url(fonts/bricolage-800.woff) format("woff");font-weight:800;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito-500.woff) format("woff");font-weight:500;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito-700.woff) format("woff");font-weight:600 700;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito-800.woff) format("woff");font-weight:800;font-display:swap}
/* Mismo lenguaje visual que SAIMAP Lingo (columna tipo móvil, tarjetas con sombra sólida, camino en zigzag),
   con la paleta del temario: azul petróleo + coral, y amarillo para la racha. */
:root{
  --h:201;
  --bg:#F1F5F8; --surface:#FFFFFF; --sunken:#E5ECF1; --ink:#142430; --muted:#4E6172; --line:#D3DEE6;
  --brand:hsl(var(--h) 63% 30%); --brand-deep:hsl(var(--h) 66% 21%); --brand-ink:#FFFFFF; --brand-soft:hsl(var(--h) 48% 91%);
  --coral:#D2553C; --coral-deep:#A33E29;
  --sun:#F5B81F; --sun-deep:#C58F07; --sun-ink:#3A2A00; --sun-soft:#FFF1C9;
  --ok:#17875A; --ok-bg:#DAF3E7; --bad:#C93A32; --bad-bg:#FBE2DF;
  --u1:hsl(var(--h) 63% 30%); --u1d:hsl(var(--h) 66% 21%); --u2:hsl(calc(var(--h) + 18) 55% 32%); --u2d:hsl(calc(var(--h) + 18) 58% 23%); --u3:hsl(calc(var(--h) - 18) 58% 34%); --u3d:hsl(calc(var(--h) - 18) 60% 25%);
  --u4:hsl(calc(var(--h) + 36) 45% 35%); --u4d:hsl(calc(var(--h) + 36) 48% 26%); --u5:hsl(calc(var(--h) - 36) 50% 33%); --u5d:hsl(calc(var(--h) - 36) 52% 24%); --uink:#FFFFFF;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1620; --surface:#15232F; --sunken:#101C27; --ink:#E8F0F6; --muted:#9AAEBF; --line:#28394A;
  --brand:hsl(var(--h) 58% 61%); --brand-deep:hsl(var(--h) 48% 43%); --brand-ink:#06131C; --brand-soft:hsl(var(--h) 38% 19%);
  --coral:#F08A73; --coral-deep:#C2614D;
  --sun:#FFCB4D; --sun-deep:#B88A12; --sun-ink:#2E2100; --sun-soft:#3A3013;
  --ok:#43CE95; --ok-bg:#12382B; --bad:#F2837B; --bad-bg:#40201E;
  --u1:hsl(var(--h) 58% 61%); --u1d:hsl(var(--h) 48% 43%); --u2:hsl(calc(var(--h) + 18) 52% 60%); --u2d:hsl(calc(var(--h) + 18) 44% 42%); --u3:hsl(calc(var(--h) - 18) 56% 63%); --u3d:hsl(calc(var(--h) - 18) 46% 45%);
  --u4:hsl(calc(var(--h) + 36) 48% 64%); --u4d:hsl(calc(var(--h) + 36) 40% 46%); --u5:hsl(calc(var(--h) - 36) 50% 62%); --u5d:hsl(calc(var(--h) - 36) 42% 44%); --uink:#06131C;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0C1620; --surface:#15232F; --sunken:#101C27; --ink:#E8F0F6; --muted:#9AAEBF; --line:#28394A;
  --brand:hsl(var(--h) 58% 61%); --brand-deep:hsl(var(--h) 48% 43%); --brand-ink:#06131C; --brand-soft:hsl(var(--h) 38% 19%);
  --coral:#F08A73; --coral-deep:#C2614D;
  --sun:#FFCB4D; --sun-deep:#B88A12; --sun-ink:#2E2100; --sun-soft:#3A3013;
  --ok:#43CE95; --ok-bg:#12382B; --bad:#F2837B; --bad-bg:#40201E;
  --u1:hsl(var(--h) 58% 61%); --u1d:hsl(var(--h) 48% 43%); --u2:hsl(calc(var(--h) + 18) 52% 60%); --u2d:hsl(calc(var(--h) + 18) 44% 42%); --u3:hsl(calc(var(--h) - 18) 56% 63%); --u3d:hsl(calc(var(--h) - 18) 46% 45%);
  --u4:hsl(calc(var(--h) + 36) 48% 64%); --u4d:hsl(calc(var(--h) + 36) 40% 46%); --u5:hsl(calc(var(--h) - 36) 50% 62%); --u5d:hsl(calc(var(--h) - 36) 42% 44%); --uink:#06131C;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:700 16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
svg{display:block}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}

/* cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px}
.brand{font:800 20px/1 var(--display);letter-spacing:-.01em;display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.brand i{font-style:normal;color:var(--brand)}
.logo{width:36px;height:36px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:800 23px/1 Georgia,"Times New Roman",serif;box-shadow:0 3px 0 var(--brand-deep);flex:none}
.stat{display:flex;align-items:center;gap:5px;font-weight:800;font-variant-numeric:tabular-nums;padding:6px 10px;border-radius:999px;background:var(--surface);border:2px solid var(--line)}
.stat svg{width:16px;height:16px}.stat.fire svg{color:var(--sun-deep)}.stat.xp svg{color:var(--brand)}
.stat.lit{background:var(--sun-soft);border-color:var(--sun)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);flex:none}
.iconbtn svg{width:20px;height:20px}

/* tarjetas de inicio */
.hero{display:flex;gap:14px;align-items:center;padding:16px;border-radius:22px;background:var(--surface);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);margin-block:6px 4px}
.hero .big{width:64px;height:64px;border-radius:20px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font:800 40px/1 Georgia,serif;flex:none}
.hero>div{min-width:0;flex:1;display:flex;flex-direction:column;gap:8px}
.hero h1{font-size:22px}.hero p{color:var(--muted);font-size:15px}
.goal{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.goal .meter{flex:1}.goal .meter i{background:var(--sun)}
.meter{height:12px;border-radius:99px;background:var(--sunken);overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.daily{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;margin-top:12px;background:linear-gradient(135deg,var(--sun-soft),var(--surface));border:2px solid var(--sun);box-shadow:0 4px 0 color-mix(in srgb,var(--sun) 55%,transparent);text-align:left;width:100%}
.daily.done{border-color:var(--line);box-shadow:0 4px 0 var(--line);background:var(--surface)}
.daily .dico{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--sun);color:var(--sun-ink)}
.daily.done .dico{background:var(--line);color:var(--ink)}.daily .dico svg{width:24px;height:24px}
.daily>div{flex:1;min-width:0}.daily b{font:800 17px/1.2 var(--display)}.daily p{color:var(--muted);font-size:14px;margin-top:2px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:14.5px;color:var(--muted)}
.tab svg{width:17px;height:17px}
.tab.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.group{display:flex;flex-direction:column;gap:10px;padding-top:18px}
.group>h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:var(--body);font-weight:800;display:flex;align-items:center;gap:8px}
.group>h2 small{margin-left:auto;font-size:12.5px;letter-spacing:0;text-transform:none}
.ccard{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--surface);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);text-align:left;width:100%;transition:transform .08s,box-shadow .08s}
.ccard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.ccard .cico{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:hsl(var(--h) 60% 36%);color:#fff;flex:none;box-shadow:0 4px 0 hsl(var(--h) 64% 25%)}
.ccard .meter i{background:hsl(var(--h) 60% 40%)}
.ccard .cico svg{width:28px;height:28px}
.ccard>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ccard b{font:800 16.5px/1.2 var(--display)}
.ccard small{color:var(--muted);font-size:13px;font-weight:700}
.ccard.soon{box-shadow:none;border-style:dashed;background:transparent;cursor:default}
.ccard.soon .cico{background:var(--sunken);color:var(--muted);box-shadow:none}
.ccard.soon b{color:var(--muted);font-weight:600}
.pill{font:800 11px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:8px;background:var(--sunken);color:var(--muted);flex:none}
.pill.pir{background:color-mix(in srgb,var(--coral) 16%,transparent);color:var(--coral)}

/* elección de ruta */
.welcome{display:flex;flex-direction:column;gap:14px;padding-block:28px}
.welcome h1{font-size:30px}.welcome>p{color:var(--muted);font-size:16.5px}
.rcard{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--surface);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);text-align:left;width:100%}
.rcard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.rcard .cico{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.rcard .cico svg{width:30px;height:30px}
.rcard b{font:800 18px/1.2 var(--display);display:block}.rcard small{color:var(--muted);font-size:14px;font-weight:700}

/* curso */
.chead{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:22px;background:var(--brand);color:var(--brand-ink);box-shadow:0 5px 0 var(--brand-deep);margin-top:4px}
.chead h1{font-size:23px}
.chead .meter{background:color-mix(in srgb,var(--brand-ink) 22%,transparent)}.chead .meter i{background:var(--sun)}
.chead .row{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:12px;font-weight:800;font-size:14px;background:color-mix(in srgb,var(--brand-ink) 16%,transparent);color:inherit;text-decoration:none}
.chip svg{width:16px;height:16px}
.cap{display:flex;align-items:center;gap:12px;padding-block:24px 0}
.cap b{font:800 13px/1 var(--display);letter-spacing:.06em;padding:8px 10px;border-radius:10px;background:var(--ink);color:var(--bg);flex:none}
.cap h2{font-size:19px;min-width:0}
.unit{scroll-margin-top:72px;padding-block:12px 4px;display:flex;flex-direction:column;gap:6px;--uc:var(--u1);--ucd:var(--u1d)}
.c2{--uc:var(--u2);--ucd:var(--u2d)}.c3{--uc:var(--u3);--ucd:var(--u3d)}.c4{--uc:var(--u4);--ucd:var(--u4d)}.c5{--uc:var(--u5);--ucd:var(--u5d)}
.uhead{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--uc);color:var(--uink);box-shadow:0 5px 0 var(--ucd)}
.uhead.locked{background:var(--sunken);color:var(--muted);box-shadow:0 5px 0 var(--line)}
.uhead .badge{width:50px;height:50px;border-radius:16px;background:color-mix(in srgb,var(--uink) 22%,transparent);display:grid;place-items:center;font:800 22px/1 var(--display);flex:none}
.uhead>div{min-width:0;flex:1}
.uhead small{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:11.5px;opacity:.9;display:flex;gap:8px;align-items:center}
.uhead h2{font-size:19px}
.uhead .pirtag{font:800 10.5px/1 var(--display);letter-spacing:.06em;padding:4px 6px;border-radius:6px;background:color-mix(in srgb,var(--uink) 22%,transparent)}
.path{display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:22px 14px;--dx:54px}
.unit.flip .path{--dx:-54px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;width:170px;position:relative}
.node:nth-of-type(2){transform:translateX(var(--dx))}.node:nth-of-type(3){transform:translateX(calc(var(--dx)*1.5))}.node:nth-of-type(4){transform:translateX(var(--dx))}
.disc{width:74px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);color:var(--muted);box-shadow:0 7px 0 var(--line);transition:transform .08s,box-shadow .08s}
.disc svg{width:28px;height:28px}
.node:active .disc{transform:translateY(5px);box-shadow:0 2px 0 var(--line)}
.node.open .disc{background:var(--uc);color:var(--uink);box-shadow:0 7px 0 var(--ucd)}
.node.done .disc{background:var(--sun);color:var(--sun-ink);box-shadow:0 7px 0 var(--sun-deep)}
.node.now{margin-top:26px}
.node.now .disc{animation:bob 1.6s ease-in-out infinite}
.node.now::before{content:"Empieza";position:absolute;top:-30px;padding:5px 10px;border-radius:10px;background:var(--surface);border:2px solid var(--line);font:800 12px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--uc);animation:bob 1.6s ease-in-out infinite}
.node b{font:600 14px/1.2 var(--display);text-align:center}
.node.shut b{color:var(--muted)}
.stars{display:flex;gap:2px;height:13px}.stars svg{width:13px;height:13px;color:var(--line)}.stars svg.on{color:var(--sun-deep)}
.path.scn{position:relative;margin-top:8px;border-radius:24px;overflow:hidden;background:var(--tint);padding-block:26px 18px;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ink) 8%,transparent)}
.path.scn .scene{position:absolute;inset:0;z-index:0}
.path.scn .scene svg{display:block;width:100%;height:100%}
.path.scn svg.road{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.path.scn .node{z-index:1}
.path.scn .node b{background:color-mix(in srgb,var(--surface) 90%,transparent);padding:3px 9px;border-radius:10px;box-shadow:0 1px 3px rgba(20,33,58,.12)}
.path.scn .node.shut .disc{background:color-mix(in srgb,var(--surface) 92%,transparent)}
.path.scn .node.now::before{z-index:2}
/* escenas: más color de día y una versión nocturna de verdad (no un gris apagado) */
.path.scn{box-shadow:inset 0 0 0 2px hsl(var(--h) 40% 50% / .18)}
.path.scn .scene{filter:saturate(1.55) contrast(1.05)}
.path.scn::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,hsl(var(--h) 70% 55% / .16),transparent 26%,transparent 72%,hsl(var(--h) 60% 35% / .16))}
.path.scn .node b{background:var(--surface);border:2px solid hsl(var(--h) 40% 50% / .25);box-shadow:0 2px 0 hsl(var(--h) 40% 30% / .12);font-weight:700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .path.scn .scene{filter:invert(.92) hue-rotate(180deg) saturate(1.7) brightness(1.02)}
  :root:not([data-theme="light"]) .path.scn svg.road{filter:brightness(.85)}
  :root:not([data-theme="light"]) .tbody .fig,:root:not([data-theme="light"]) img.zoom{background:#E4E0D6;border-color:#3A4A59}:root:not([data-theme="light"]) .tbody .fig img{filter:brightness(.93)}}
:root[data-theme="dark"] .path.scn .scene{filter:invert(.92) hue-rotate(180deg) saturate(1.7) brightness(1.02)}
:root[data-theme="dark"] .path.scn svg.road{filter:brightness(.85)}
:root[data-theme="dark"] .tbody .fig,:root[data-theme="dark"] img.zoom{background:#E4E0D6;border-color:#3A4A59}:root[data-theme="dark"] .tbody .fig img{filter:brightness(.93)}
/* mascota */
.psique .pw{transform-box:view-box;transform-origin:60px 64px;animation:flap 3.2s ease-in-out infinite}
.psique .pw.r{animation-delay:.05s}
@keyframes flap{0%,70%,100%{transform:scaleX(1)}78%{transform:scaleX(.84)}86%{transform:scaleX(1)}92%{transform:scaleX(.9)}}
@keyframes flapfast{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.72)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes droop{0%,100%{transform:rotate(0)}30%{transform:rotate(-4deg)}60%{transform:rotate(3deg)}}
.psique.m-wow .pw,.psique.m-wink .pw{animation:flapfast .38s ease-in-out infinite}
.psique.m-happy .pw{animation-duration:2s}
.mascot.fly,.psique.fly{animation:hover 2.2s ease-in-out infinite}
.psique.m-sad{animation:droop .9s ease-in-out 1}
.hero .mascot{width:96px;height:100px;flex:none;margin:-8px -4px -8px -6px}
.mascot svg{width:100%;height:100%}
.result .mascot.big{width:150px;height:155px;animation:pop .4s ease-out}
.mascot-hi{display:flex;align-items:center;gap:12px}
.mascot-hi>svg{width:132px;height:136px;flex:none;margin-left:-10px}
.bubble{position:relative;padding:12px 14px;border-radius:18px;background:var(--surface);border:2px solid var(--line);font-size:14.5px;color:var(--muted);font-weight:700}
.bubble b{color:var(--ink)}
@media (max-width:360px){.mascot-hi>svg{width:84px;height:88px}}
.foot{padding-block:22px 30px;color:var(--muted);font-size:13.5px;text-align:center;display:flex;flex-direction:column;gap:6px}
.foot a{color:var(--brand)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pop{0%{transform:scale(.92);opacity:.4}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.still *,.still *::before,.still *::after{animation:none!important;transition:none!important}
::view-transition-old(root),::view-transition-new(root){animation-duration:.18s}

/* botones */
.btn{display:block;width:100%;padding:15px 18px;border-radius:16px;font:800 16px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;background:var(--brand);color:var(--brand-ink);box-shadow:0 5px 0 var(--brand-deep);transition:transform .08s,box-shadow .08s;text-align:center;text-decoration:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brand-deep)}
.btn[disabled]{background:var(--sunken);color:var(--muted);box-shadow:0 5px 0 var(--line);cursor:default;transform:none}
.btn.plain{background:var(--surface);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.good{background:var(--ok);color:var(--surface);box-shadow:0 5px 0 color-mix(in srgb,var(--ok) 70%,#000)}
.btn.warn{background:var(--bad);color:var(--surface);box-shadow:0 5px 0 color-mix(in srgb,var(--bad) 70%,#000)}

/* hoja inferior */
.veil{position:fixed;inset:0;z-index:20;background:rgba(6,14,22,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88%;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:22px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:rise .22s ease-out}
.sheet h2{font-size:23px}
.sub{color:var(--muted);font-size:15px}
.tip{padding:12px 14px;border-radius:16px;background:var(--brand-soft);font-size:15px;font-weight:600}
.tip b{display:block;font:800 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;color:var(--brand)}
.opts{display:flex;flex-direction:column;gap:10px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:2px solid var(--sunken)}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--sunken)}
.seg button{padding:7px 10px;border-radius:9px;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.small{font-size:13.5px;color:var(--muted);font-weight:600}
.small a{color:var(--brand)}
/* cuenta */
.acct{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--sunken)}
.acct h3{font:800 17px/1.2 var(--display)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);text-transform:none;letter-spacing:0}
.gbtn svg{width:20px;height:20px;flex:none}
.form{display:flex;flex-direction:column;gap:10px}
.form input,.field{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px var(--body)}
.form input:focus,.field:focus{outline:none;border-color:var(--brand)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .btn{padding:13px 8px;font-size:14px}
.linkbtn{align-self:center;padding:6px;font-weight:700;font-size:14px;color:var(--brand);text-decoration:underline}
.linkbtn.danger{color:var(--bad)}
.msg{font-size:14px;font-weight:700;color:var(--ink)}.msg.err,.msg:empty{color:var(--bad)}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who>div{display:flex;flex-direction:column;min-width:0}.who b,.who small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--muted);font-size:13px;font-weight:600}
.av{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);font:800 19px var(--display);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.notice{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:18px;background:var(--brand-soft);font-size:14.5px;font-weight:700}
.notice span{flex:1}.btn.sm{width:auto;padding:10px 14px;font-size:13px;flex:none}

/* lección */
.lesson{display:flex;flex-direction:column;min-height:100dvh;padding-bottom:0}
.lbar{display:flex;align-items:center;gap:12px;padding-block:14px}
.lbar .meter{flex:1;height:16px}.lbar .meter i{background:var(--ok)}
.lbar .x{width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}.lbar .x svg{width:24px;height:24px}
.stage{flex:1;display:flex;flex-direction:column;gap:16px;padding-block:6px 20px;animation:pop .25s ease-out}
#body{display:flex;flex-direction:column;gap:14px}
.kind{font:800 13px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--brand);display:flex;align-items:center;gap:8px}
.kind .rv{color:var(--coral);background:color-mix(in srgb,var(--coral) 14%,transparent);padding:4px 7px;border-radius:7px;font-size:11px}
.prompt{font:800 22px/1.3 var(--display)}
.prompt.def{font:700 19px/1.45 var(--body)}
.prompt.stmt{font:700 19.5px/1.45 var(--body);padding:16px;border-radius:18px;background:var(--surface);border:2px solid var(--line)}
.gapw{display:inline-block;min-width:80px;border-bottom:3px solid var(--brand);color:var(--brand);text-align:center;padding:0 6px}
.choice{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 14px;border-radius:16px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-weight:700;font-size:16px;line-height:1.35;transition:transform .06s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .k{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font:800 13px/1 var(--display);color:var(--muted);flex:none}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 4px 0 var(--brand)}
.opt.sel .k{border-color:var(--brand);color:var(--brand)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 4px 0 var(--bad);animation:shake .35s}
.opt[disabled]{cursor:default}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfrow .opt{justify-content:center;font:800 17px/1 var(--display);padding:18px 10px}
.tfrow .opt.ns{grid-column:1/-1;font-size:15px;color:var(--muted);padding:13px}
.typein{width:100%;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:18px}
.typein:focus{border-color:var(--brand);outline:none}
/* emparejar */
.match{display:flex;flex-direction:column;gap:14px}
.mchips{display:flex;flex-wrap:wrap;gap:8px}
.mchip{padding:10px 13px;border-radius:13px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font:800 15px/1.2 var(--display)}
.mdefs{display:flex;flex-direction:column;gap:8px}
.mdef{padding:11px 13px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-size:14.5px;line-height:1.35;text-align:left;font-weight:600}
.mchip.sel,.mdef.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 3px 0 var(--brand)}
.mchip.gone,.mdef.gone{opacity:.35;box-shadow:none;border-style:dashed;cursor:default}
.mchip.bad,.mdef.bad{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}
/* ordenar */
.slots{display:flex;flex-direction:column;gap:8px;min-height:60px;padding:10px;border-radius:18px;border:2px dashed var(--line)}
.slots .empty{color:var(--muted);font-size:14px;text-align:center;padding:10px}
.step{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-size:15px;text-align:left;width:100%;font-weight:700;line-height:1.3}
.step i{font-style:normal;width:24px;height:24px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font:800 12.5px/1 var(--display);flex:none}
.bank{display:flex;flex-direction:column;gap:8px}
.step.used{visibility:hidden}
.step.right{border-color:var(--ok);background:var(--ok-bg)}.step.wrong{border-color:var(--bad);background:var(--bad-bg)}
/* clasificar */
.card1{padding:18px;border-radius:18px;background:var(--surface);border:2px solid var(--brand);box-shadow:0 5px 0 var(--brand);font:800 18px/1.3 var(--display);text-align:center;animation:pop .2s ease-out}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.cat{padding:12px;border-radius:16px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:6px;text-align:left;min-height:84px}
.cat>b{font:800 14.5px/1.2 var(--display);color:var(--brand)}
.cat span{font-size:12.5px;font-weight:700;padding:4px 7px;border-radius:8px;background:var(--sunken)}
.cat span.bad{background:var(--bad-bg);color:var(--bad)}
.cat.flash{border-color:var(--bad);animation:shake .35s}
/* barra de comprobación */
.checkbar{position:sticky;bottom:0;margin-inline:-16px;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line);display:flex;flex-direction:column;gap:12px}
.checkbar.ok{background:var(--ok-bg);border-color:transparent}
.checkbar.no{background:var(--bad-bg);border-color:transparent}
.fb{display:flex;gap:12px;align-items:flex-start}
.fb .fi{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface)}
.fb .fm{width:64px;height:66px;flex:none;margin:-14px -4px -8px -8px;animation:pop .3s ease-out}.fb .fm svg{width:100%;height:100%}
.fb .fi svg{width:24px;height:24px}
.checkbar.ok .fi{color:var(--ok)}.checkbar.no .fi{color:var(--bad)}
.fb h3{font-size:20px}.checkbar.ok h3{color:var(--ok)}.checkbar.no h3{color:var(--bad)}
.fb p{font-size:15px;font-weight:600;margin-top:4px}
.fb p b{font-weight:800}
/* resultados */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding-block:30px}
.result .bigstars{display:flex;gap:8px}.result .bigstars svg{width:56px;height:56px;color:var(--line)}.result .bigstars svg.on{color:var(--sun)}
.result h1{font-size:28px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.kpi{padding:12px 6px;border-radius:16px;border:2px solid var(--line);background:var(--surface)}
.kpi b{display:block;font:800 22px/1.1 var(--display)}.kpi small{color:var(--muted);font-size:12.5px}
.result .btn{margin-top:8px}
.empty-note{padding:22px;border-radius:20px;border:2px dashed var(--line);color:var(--muted);text-align:center;margin-top:16px}

/* teoría: el apartado del temario antes de cada lección */
.theory{padding-bottom:110px}
.thead{display:flex;flex-direction:column;gap:8px;padding:6px 0 16px;border-bottom:2px solid var(--line);margin-bottom:16px}
.thead small{font:800 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--u1)}
.theory.c2 .thead small{color:var(--u2)} .theory.c3 .thead small{color:var(--u3)} .theory.c4 .thead small{color:var(--u4)} .theory.c5 .thead small{color:var(--u5)}
.thead h1{font-size:27px;letter-spacing:-.01em}
.skip{align-self:flex-start;display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:var(--brand);padding:6px 0}
.skip svg{width:16px;height:16px}
.tbody{font:500 16.5px/1.6 var(--body);color:var(--ink);overflow-wrap:break-word}
.tbody>*+*{margin-top:14px}
.tbody strong{font-weight:800}
.tbody h3{font-size:19px;margin:0 0 8px;color:var(--coral)}
.tbody ul,.tbody ol{padding-left:22px;margin-bottom:0}
.tbody li+li{margin-top:6px}
.tbody li p{margin:0}
.tbody p.obj{padding:12px 14px;border-radius:14px;background:var(--brand-soft);font-size:15.5px}
.tbody p.obj strong{display:block;font:800 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin-bottom:6px}
.tbody blockquote{margin:14px 0 0;padding:12px 16px;border-radius:14px;background:var(--sunken);border-left:4px solid var(--brand);font-variant-numeric:tabular-nums}
.tbody blockquote p{margin:0}
.tbody .sp{display:inline-block;width:1.6em}
.tw{overflow-x:auto;border:2px solid var(--line);border-radius:14px;-webkit-overflow-scrolling:touch}
.tbody table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.42;min-width:420px}
.tbody th{background:var(--brand-soft);color:var(--ink);text-align:left;font-weight:800}
.tbody th,.tbody td{padding:8px 10px;vertical-align:top;border-bottom:1px solid var(--line)}
.tbody tr:last-child td{border-bottom:0}
.tbody figure{margin:18px 0 0}
.tbody .fig{margin:0;background:#fff;border-radius:16px;padding:8px;border:2px solid var(--line);text-align:center}
.tbody .fig img{max-width:100%;height:auto;border-radius:10px;cursor:zoom-in;display:inline-block}
.tbody .fig.m img{max-width:min(100%,380px)} .tbody .fig.s img{max-width:min(100%,290px)}
.tbody figcaption{font-size:13.5px;line-height:1.45;color:var(--muted);margin-top:8px;padding:0 4px}
.tbody figcaption strong{color:var(--ink)}
.tbody .gap{display:inline-block;width:3em;border-bottom:2px solid currentColor}
.tbody .blk{padding:14px 16px;border-radius:16px;margin-top:16px}
.tbody .blk>*+*{margin-top:10px}
.tbody .blk h3{font-size:17px}
.blk.consenso{background:color-mix(in srgb,var(--ok) 12%,var(--surface));border-left:4px solid var(--ok)} .blk.consenso h3{color:var(--ok)}
.blk.mito{background:var(--sun-soft);border-left:4px solid var(--sun-deep)} .blk.mito h3{color:var(--sun-deep)}
.blk.pir{border:2px solid var(--coral)}
.blk.claves{background:var(--brand-soft)} .blk.claves h3{color:var(--brand)} .blk.claves .tw{background:var(--surface)}
.blk.ejemplo{background:var(--surface);border:2px solid var(--line)} .blk.ejemplo h3{color:var(--u4)}
.tbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.tbar .btn{max-width:528px;margin:0 auto}
img.zoom{width:100%;height:auto;background:#fff;border-radius:12px}

/* inicio: continuar, semana y anillo de meta */
.ring{position:relative;width:76px;height:76px;flex:none}.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--sun);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.3,1.2,.5,1)}
.ring>span{position:absolute;inset:0;display:grid;place-items:center;text-align:center}.ring>span>span{font:800 18px/1 var(--display)}.ring small{display:block;font:700 10.5px/1.1 var(--body);color:var(--muted);margin-top:2px}
.hero .ring{margin-left:auto}.hero .mascot{width:84px;height:88px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px;padding:12px;border-radius:20px;background:var(--surface);border:2px solid var(--line)}
.week .d{display:flex;flex-direction:column;align-items:center;gap:5px;font:800 12px/1 var(--display);color:var(--muted)}
.week .d i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);color:var(--muted)}
.week .d i svg{width:16px;height:16px}
.week .d.on i{background:var(--sun);color:var(--sun-ink);box-shadow:0 3px 0 var(--sun-deep)}
.week .d.today{color:var(--ink)}.week .d.today i{outline:2px solid var(--sun);outline-offset:2px}
.week .d.future i{opacity:.45}
.cont{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;padding:16px;border-radius:22px;text-align:left;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 62% 36%),hsl(calc(var(--h) + 24) 58% 30%));box-shadow:0 5px 0 hsl(var(--h) 66% 20%);transition:transform .08s,box-shadow .08s}
.cont:active{transform:translateY(4px);box-shadow:0 1px 0 hsl(var(--h) 66% 20%)}
.cont .play{width:52px;height:52px;border-radius:50%;background:#fff;color:hsl(var(--h) 62% 32%);display:grid;place-items:center;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.cont .play svg{width:26px;height:26px;margin-left:3px}
.cont>div{flex:1;min-width:0}.cont small{font:800 11.5px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.cont b{display:block;font:800 18px/1.2 var(--display);margin-top:5px}.cont p{font-size:14px;opacity:.9;margin-top:3px}
.cont.skel{background:var(--sunken);box-shadow:none;color:var(--muted);min-height:84px}
.stat{cursor:pointer}
.linkrow{display:flex;justify-content:center;margin-top:12px}
.linkrow button{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:var(--brand);padding:6px 10px}
.linkrow svg{width:16px;height:16px}

/* estadísticas */
.stats{display:flex;flex-direction:column;gap:14px;padding-bottom:30px}
.stats h1{font-size:26px;margin-top:6px}
.stats h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:var(--body);font-weight:800;margin-top:8px}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kgrid .kpi{text-align:center;padding:14px 8px}.kgrid .kpi b{font-size:26px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;padding:14px;border-radius:20px;background:var(--surface);border:2px solid var(--line);overflow-x:auto}
.heat i{width:14px;height:14px;border-radius:4px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--sun) 45%,var(--sunken))}.heat i.l2{background:color-mix(in srgb,var(--sun) 75%,var(--sunken))}.heat i.l3{background:var(--sun)}
.heat i.t{outline:2px solid var(--ink);outline-offset:1px}
.crow{text-align:left;width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--surface);border:2px solid var(--line)}
.crow .dot{width:12px;height:40px;border-radius:6px;background:hsl(var(--h) 60% 42%);flex:none}
.crow>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}.crow b{font:800 15px/1.2 var(--display)}
.crow small{color:var(--muted);font-size:13px}.crow .meter{height:9px}.crow .meter i{background:hsl(var(--h) 60% 42%)}
.weak{display:flex;flex-direction:column;gap:8px}
.weak div{padding:11px 14px;border-radius:16px;background:var(--surface);border:2px solid var(--line);font-size:14.5px}
.weak b{font-family:var(--display)}.weak small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}

/* resumen de la lección */
.recap{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px}
.recap h2{font-size:17px}
.recap .it{padding:11px 13px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-size:14.5px;font-weight:600}
.recap .it b{font-weight:800}
.recap .it small{display:block;color:var(--muted);margin-top:3px;font-size:13px}
.combo{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;background:var(--sun);color:var(--sun-ink);font:800 15px/1 var(--display);box-shadow:0 4px 0 var(--sun-deep);animation:pop .3s ease-out}
.combo svg{width:36px;height:38px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:.9}}

/* teoría: progreso de lectura, tamaño de letra y términos clave */
.readbar{position:fixed;left:0;top:0;height:4px;width:100%;z-index:12;background:transparent}
.readbar i{display:block;height:100%;width:0;background:var(--brand);border-radius:0 4px 4px 0}
.ttools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fsz{display:flex;gap:4px;margin-left:auto;padding:3px;border-radius:12px;background:var(--sunken)}
.fsz button{min-width:38px;padding:6px 8px;border-radius:9px;font:800 14px/1 var(--display);color:var(--muted)}
.fsz button:active{background:var(--surface)}
.tbody{font-size:var(--tfs,16.5px)}
.term{display:inline;font:inherit;color:inherit;padding:0;border-bottom:2px dotted var(--brand);cursor:help;text-align:inherit}
.term:hover,.term:focus-visible{background:var(--brand-soft)}
.gloss{padding:14px 16px;border-radius:16px;background:var(--brand-soft)}.gloss b{display:block;font:800 18px/1.2 var(--display);color:var(--brand);margin-bottom:6px}
.chip.ok{background:color-mix(in srgb,var(--ok) 30%,transparent)}
.togg{width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.togg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.togg[aria-checked="true"]{background:var(--ok)}.togg[aria-checked="true"]::after{left:25px}
.setrow select{padding:7px 10px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 14px var(--body)}
.setnote{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:-6px}

/* vidas y Premium */
.stat.life svg{color:var(--coral)}.stat.life.empty{background:color-mix(in srgb,var(--coral) 14%,var(--surface));border-color:var(--coral)}
.stat.life.inf{background:linear-gradient(135deg,#FFE7A3,#F5B81F);border-color:var(--sun-deep);color:var(--sun-ink)}.stat.life.inf svg{color:#B03A2E}
@media (max-width:400px){.top .brand>span:not(.logo){display:none}}
.lifebar{display:flex;align-items:center;gap:4px;font:800 15px/1 var(--display);color:var(--coral)}.lifebar svg{width:20px;height:20px}
.nolives{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.nolives .mascot{width:120px;height:124px}
.hearts{display:flex;gap:6px}.hearts svg{width:28px;height:28px;color:var(--line)}.hearts svg.on{color:var(--coral)}
.timer{font:800 15px/1 var(--display);color:var(--muted)}
.prem{display:flex;flex-direction:column;gap:14px;padding-bottom:30px}
.prem .phero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 16px;border-radius:24px;background:linear-gradient(160deg,#FFF1C9,#FFE0A3 55%,#F9C66B);color:#3A2A00;box-shadow:0 5px 0 #C58F07}
.prem .phero .mascot{width:110px;height:114px}.prem .phero h1{font-size:28px}.prem .phero p{font-size:15px;opacity:.85}
.perks{display:flex;flex-direction:column;gap:8px}
.perk{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface);border:2px solid var(--line)}
.perk i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--sun-soft);color:var(--sun-deep);flex:none}.perk i svg{width:22px;height:22px}
.perk b{display:block;font:800 15.5px/1.2 var(--display)}.perk small{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:2px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan{position:relative;padding:16px 12px 14px;border-radius:18px;background:var(--surface);border:3px solid var(--line);text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.plan.on{border-color:var(--sun-deep);background:var(--sun-soft)}
.plan b{font:800 22px/1.1 var(--display)}.plan small{color:var(--muted);font-size:13px}.plan .t{font:800 13px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.plan .save{position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:4px 8px;border-radius:8px;background:var(--ok);color:#fff;font:800 11px/1 var(--display);white-space:nowrap}
.btn.gold{background:#F5B81F;color:#3A2A00;box-shadow:0 5px 0 #B88A12}
.fine{font-size:12.5px;color:var(--muted);text-align:center;font-weight:600}.fine a{color:var(--brand)}
.badge-prem{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:7px;background:#F5B81F;color:#3A2A00;font:800 11px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
</style>
</head>
