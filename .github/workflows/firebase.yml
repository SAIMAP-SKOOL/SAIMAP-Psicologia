# Despliega las funciones de Premium (verificarCompra, comprobarPremium, limpiarCuenta) y las reglas de Firestore
# en el proyecto saimap-lingo. Sin claves: GitHub se identifica ante Google Cloud con Workload Identity Federation
# (grupo "github", proveedor "saimap-psicologia") y actúa como la cuenta github-deploy.
# El resultado queda en la rama "firebase-deploy" (estado.txt y deploy.log).
name: Firebase
on:
  push:
    branches: [main]
    paths: ["firebase/**", ".github/workflows/firebase.yml"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/103281447895/locations/global/workloadIdentityPools/github/providers/saimap-psicologia
          service_account: github-deploy@saimap-lingo.iam.gserviceaccount.com
          create_credentials_file: true
      - name: Desplegar
        run: |
          set -o pipefail
          cd firebase/functions && npm install --no-audit --no-fund 2>&1 | tail -3 | tee ../../deploy.log
          cd .. && npx --yes firebase-tools@14 deploy --only functions,firestore:rules --project saimap-lingo --force --non-interactive 2>&1 | tee -a ../deploy.log
      - name: Publicar el resultado en la rama firebase-deploy
        if: always()
        run: |
          mkdir out; cp deploy.log out/ || true
          echo "${GITHUB_SHA} ${{ job.status }}" > out/estado.txt
          cd out && git init -q -b firebase-deploy
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Despliegue ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" firebase-deploy
